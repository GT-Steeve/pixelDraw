<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, user-scalable=yes">
<title>Pixel Draw</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- ÉCRAN TITRE -->
  <section class="screen screen-title" id="screenTitle" role="button" tabindex="0">
    <canvas id="titleMascot" class="title-mascot"></canvas>
    <div class="title-logo">PIXEL<br>DRAW</div>
    <p class="title-cta">Touche ici pour commencer</p>
  </section>

  <!-- ÉCRAN SÉLECTION -->
  <section class="screen screen-select" id="screenSelect" hidden>
    <div class="select-head">
      <button class="pill icon-only game-back" id="selectBackBtn" aria-label="Retour au titre" title="Retour au titre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="select-title">
        <h2 class="select-name">Choisis ton dessin</h2>
      </div>
      <div class="progress-ring" id="selectProgressRing" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle class="progress-ring-track" cx="20" cy="20" r="16"/>
          <circle class="progress-ring-fill" id="selectProgressRingFill" cx="20" cy="20" r="16" pathLength="100"/>
        </svg>
        <span class="progress-ring-label" id="selectProgressRingLabel">0%</span>
      </div>
    </div>

    <div class="puzzle-grid" id="puzzleGrid"></div>

    <div class="pager">
      <button class="pill icon-only" id="pagePrevBtn" title="Page précédente" aria-label="Page précédente">‹</button>
      <div class="page-dots" id="pageDots"></div>
      <button class="pill icon-only" id="pageNextBtn" title="Page suivante" aria-label="Page suivante">›</button>
    </div>
  </section>

  <!-- ÉCRAN DE JEU -->
  <section class="screen screen-game" id="screenGame" hidden>

    <div class="game-head">
      <button class="pill icon-only game-back" id="gameBackBtn" aria-label="Retour à la sélection" title="Retour à la sélection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="game-title">
        <span class="game-name" id="gameName"></span>
        <span class="game-diff" id="gameDiff"></span>
      </div>
      <div class="progress-ring" id="progressRing" aria-hidden="true">
        <svg viewBox="0 0 40 40" width="40" height="40">
          <circle class="progress-ring-track" cx="20" cy="20" r="16"/>
          <circle class="progress-ring-fill" id="progressRingFill" cx="20" cy="20" r="16" pathLength="100"/>
        </svg>
        <span class="progress-ring-label" id="progressRingLabel">0%</span>
      </div>
    </div>

    <div class="hint" id="hint">
      <svg class="hint-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.4c.6.5 1 1.3 1 2.1V16h6v-.5c0-.8.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg>
      <p>Repère-toi avec les bandes de couleur sur les bords : la même position entre le modèle et la grille vierge indique où poser chaque couleur.</p>
      <button class="hint-close" id="hintClose" aria-label="Fermer l'astuce" title="Fermer l'astuce">×</button>
    </div>

    <div class="reference">
      <span class="reference-label">Modèle à reproduire</span>
      <div class="ref-board">
        <div class="board-grid">
          <div class="guide-corner"></div>
          <div class="guide-top" id="refGuideTop"></div>
          <div class="guide-left" id="refGuideLeft"></div>
          <div class="ref-grid" id="refGrid"></div>
        </div>
      </div>
    </div>

    <div class="progress-row">
      <div class="zoom-group desktop-zoom" id="zoomGroupBoard">
        <button class="zoom-btn" id="zoomOutBtn" title="Zoom arrière (dessin)" aria-label="Zoom arrière (dessin)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="zoom-btn" id="zoomInBtn" title="Zoom avant (dessin)" aria-label="Zoom avant (dessin)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
      <span class="progress-count" id="progressCount">0/0</span>
      <div class="progress-bar"><div class="progress-bar-fill" id="progressBarFill"></div></div>
      <span class="progress-remaining" id="progressRemaining">0 restantes</span>
      <div class="zoom-group zoom-group-sm desktop-zoom" id="zoomGroupRef">
        <button class="zoom-btn zoom-btn-sm" id="refZoomOutBtn" title="Zoom arrière (modèle)" aria-label="Zoom arrière (modèle)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
        <button class="zoom-btn zoom-btn-sm" id="refZoomInBtn" title="Zoom avant (modèle)" aria-label="Zoom avant (modèle)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
        </button>
      </div>
    </div>

    <div class="stage">
      <div class="board">
        <div class="board-grid">
          <div class="guide-corner"></div>
          <div class="guide-top" id="guideTop"></div>
          <div class="guide-left" id="guideLeft"></div>
          <div class="grid" id="grid"></div>
        </div>
      </div>

      <div class="palette-wrap">
        <div class="palette" id="palette"></div>
        <div class="palette-edge palette-edge-left" id="paletteEdgeLeft" aria-hidden="true"><i></i></div>
        <div class="palette-edge palette-edge-right" id="paletteEdgeRight" aria-hidden="true"><i></i></div>
      </div>

      <div class="toolbar">
        <button class="pill eraser" id="eraserBtn" title="Gomme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 18"/></svg>
          Gomme
        </button>
        <button class="pill solution" id="solutionBtn" title="Solution">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          Solution
        </button>
      </div>
    </div>
  </section>

<canvas id="fxCanvas"></canvas>
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>Terminé ! 🎉</h2>
    <p id="winMessage">Bravo, le dessin est complet.</p>
    <div class="win-actions">
      <button class="pill primary" id="winNextBtn">Dessin suivant ›</button>
      <div class="row">
        <button class="pill" id="winRestartBtn">Recommencer</button>
        <button class="pill" id="winSelectBtn">Sélection</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="assets/js/app.js"></script>
</body>
</html>
