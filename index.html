<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pixel Draw</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div class="head">
    <h1>Dessine en pixels</h1>
    <p>Glisse le doigt sur la grille pour colorier, choisis une teinte ci-dessous.</p>
  </div>

  <div class="reference">
    <span class="reference-label">Modèle à reproduire</span>
    <div class="ref-grid" id="refGrid"></div>
    <button class="pill" id="animateBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3"/><path d="M12 18v3"/><path d="M4.2 4.2l2.1 2.1"/><path d="M17.7 17.7l2.1 2.1"/><path d="M3 12h3"/><path d="M18 12h3"/><path d="M4.2 19.8l2.1-2.1"/><path d="M17.7 6.3l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
      Animer l’éclosion
    </button>
  </div>

  <div class="stage">
    <div class="board">
      <div class="grid" id="grid"></div>
    </div>

    <div class="palette" id="palette"></div>

    <div class="toolbar">
      <button class="pill" id="undoBtn" title="Annuler">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h10a5 5 0 0 1 0 10H8"/><polyline points="7 5 3 10 7 15"/></svg>
        Annuler
      </button>
      <button class="pill eraser" id="eraserBtn" title="Gomme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8l9-9a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 18"/></svg>
        Gomme
      </button>
      <button class="pill" id="clearBtn" title="Tout effacer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        Effacer
      </button>
      <button class="pill" id="downloadBtn" title="Télécharger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M5 20h14"/></svg>
        Télécharger
      </button>
    </div>
  </div>

<script src="assets/js/app.js"></script>
</body>
</html>
